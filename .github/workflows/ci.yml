name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
  # release.yml calls this workflow as a gate so a tag-push runs the
  # full CI suite before packaging starts.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

# When BCTP pushes a `chore: bump version` commit to main, the same SHA is
# tag-pushed moments later — release.yml fires and invokes this workflow as
# a reusable gate. Skip the standalone main-push run for that exact commit
# subject so CI doesn't execute twice on the same SHA. Disambiguation:
#   - main-push of bump commit  → ref=refs/heads/main, msg=chore: bump… → SKIP
#   - tag-push via release.yml  → workflow_call (no head_commit gate)   → RUN
#   - PR / direct main push     → other event, or different msg          → RUN

jobs:
  test:
    name: Test (${{ matrix.platform }})
    if: "${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: bump version')) }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Build (release)
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    if: "${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: bump version')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
