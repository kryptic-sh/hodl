[graph]
all-features = true
# Restrict the graph to the targets we actually ship binaries for.
# Without this, cargo-deny sees every transitive dep across every target
# in Cargo.lock — including the entire Windows transitive subtree pulled
# in by `keyring`'s `windows-native` feature, which is `#[cfg(windows)]`-
# gated and never built on the platforms we ship to.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots — Mozilla CA bundle
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Transitive duplicates we can't collapse without forking upstream:
# - thiserror 1.x: pinned by base58-monero
# - the RustCrypto digest 0.10 / rand_core 0.6 generation, beside the
#   digest 0.11 / rand_core 0.10 one that k256 0.14 and bip32 0.6 need: bs58
#   0.5 (its latest) uses sha2 0.10, bls12_381 stays on digest 0.10 even in
#   0.9, bip39 caps rand_core below 0.7, ring uses getrandom 0.2, and hkdf
#   0.12 uses hmac 0.12. argon2, chacha20poly1305, curve25519-dalek, rand and
#   bls12_381 0.9 (ff and group 0.14) have releases on the new generation;
#   docs/backlog.md tracks moving them.
# - hashbrown 0.16: ratatui-core (0.1.2, its latest) requires it, while
#   indexmap is on 0.17.
# - miniz_oxide 0.8: flate2 1.1.9 under ureq 2, beside hjkl-clipboard's 0.9.
#   flate2 1.1.10 moves to 0.9 but also switches its backend to zlib-rs.
skip = [
    { crate = "thiserror@1" },
    { crate = "thiserror-impl@1" },
    { crate = "block-buffer@0.10" },
    { crate = "cpufeatures@0.2" },
    { crate = "crypto-common@0.1" },
    { crate = "digest@0.10" },
    { crate = "ff@0.13" },
    { crate = "getrandom@0.2" },
    { crate = "group@0.13" },
    { crate = "hmac@0.12" },
    { crate = "rand_core@0.6" },
    { crate = "sha2@0.10" },
    { crate = "hashbrown@0.16" },
    { crate = "miniz_oxide@0.8" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
