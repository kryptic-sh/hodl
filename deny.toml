[graph]
all-features = true
# Restrict the graph to the targets we actually ship binaries for.
# Without this, cargo-deny sees every transitive dep across every target
# in Cargo.lock — including the entire Windows transitive subtree pulled
# in by `keyring`'s `windows-native` feature, which is `#[cfg(windows)]`-
# gated and never built on the platforms we ship to.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots — Mozilla CA bundle
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Transitive duplicates we can't collapse without forking upstream:
# - thiserror 1.x: pinned by base58-monero
skip = [
    { crate = "thiserror@1" },
    { crate = "thiserror-impl@1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
